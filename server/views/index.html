<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Painel — Chamadas de Garçom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/bootstrap-icons-1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"> -->

  <style>
    /* === Minimal cards: número grande + hora === */
    :root{
      --bg-1: #14171a;
      --bg-2: #17191c;
      --card: #0f1416;
      --accent: #dc3545;
      --accent-2: #c82333;
      --text: #e6eef8;
      --muted: #9aa6b2;
      --radius: 12px;
      --stripe-h: 6px;
    }

    html,body{
      height:100%;
      margin:0;
      font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
      color:var(--text);
    }

    .wrap{
      padding:1.5rem;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:1rem;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:1rem;
    }

    /* LOGO — tamanho original */
    .logo{
      width:78px;
      height:78px;
      border-radius:14px;
      border:2px solid rgba(255,255,255,0.05);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:rgba(255,255,255,0.03);
      color:var(--accent);
    }
    .logo-placeholder{
      text-align:center;
      font-size:0.72rem;
      color:var(--muted);
    }

    h1{
      margin:0;
      font-size:clamp(1.25rem,2.3vw,1.9rem);
      font-weight:700;
    }

    .status{ text-align:right; }

    .big-badge{
      background:transparent;
      border:2px solid rgba(255,255,255,0.05);
      border-radius:10px;
      padding:0.5rem 1rem;
      display:inline-block;
      min-width:150px;
    }
    .big-badge .count{
      color:var(--accent);
      font-weight:700;
      font-size:1.2rem;
    }

    main{ flex:1; overflow:auto; }

    #chamadas{
      display:grid;
      gap:1.2rem;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      padding-top:0.5rem;
    }

    .mesa-card{
      position:relative;
      background:var(--card);
      border-radius:var(--radius);
      border:1px solid rgba(255,255,255,0.03);
      padding-top: calc(1.6rem + var(--stripe-h));
      padding-bottom:1.6rem;
      padding-left:1rem;
      padding-right:1rem;
      text-align:center;
      display:flex;
      justify-content:center;
      flex-direction:column;
      gap:0.4rem;
    }

    /* faixa vermelha no topo */
    .mesa-card::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:var(--stripe-h);
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      border-top-left-radius:var(--radius);
      border-top-right-radius:var(--radius);
    }

    .mesa-number{
      font-weight:900;
      font-size:clamp(2.6rem,6.6vw,5.3rem);
      letter-spacing:-1px;
      color:var(--text);
    }

    .mesa-time{
      font-weight:600;
      font-size:clamp(1.05rem,1.7vw,1.35rem);
      color:var(--muted);
    }

    .pulse{
      animation:pulse-flat 1.1s ease-in-out;
    }
    @keyframes pulse-flat{
      0%{ box-shadow: inset 0 0 0 rgba(220,53,69,0); }
      50%{ box-shadow: inset 0 0 16px rgba(220,53,69,0.09); }
      100%{ box-shadow: inset 0 0 0 rgba(220,53,69,0); }
    }

    .no-calls{
      color:var(--muted);
      text-align:center;
      margin-top:2rem;
    }

    footer{
      display:flex;
      justify-content:space-between;
      color:var(--muted);
      font-size:0.9rem;
      opacity:0.95;
      margin-top:1rem;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">
          <i class="bi bi-image" style="font-size:1.4rem;"></i>
          <div class="logo-placeholder">LOGO</div>
        </div>

        <div>
          <h1>Oi Garçom</h1>
          <div style="color:var(--muted); font-weight:600; margin-top:4px;">Solicitação de atendimento</div>
        </div>
      </div>

      <div class="status">
        <div class="big-badge">
          <div style="font-size:0.75rem; color:var(--muted)">Total</div>
          <div class="count" id="totalChamadas">0 chamadas</div>
        </div>
      </div>
    </header>

    <main>
      <div id="chamadas"></div>

      <div id="semChamadas" class="no-calls d-none">
        <i class="bi bi-emoji-smile" style="font-size:2.4rem;"></i><br>
        Nenhuma chamada no momento
      </div>
    </main>

    <footer>
      <div>Desenvolvido por <strong>Davy Batista</strong></div>
      <div><strong>Fatec Santo André</strong> — Orientado por Prof. <strong>Carlos Morioka</strong></div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const container = document.getElementById('chamadas');
    const totalChamadas = document.getElementById('totalChamadas');
    const semChamadas = document.getElementById('semChamadas');
    let calls = [];

    /* HORÁRIO EXATAMENTE IGUAL AO ARQUIVO ORIGINAL */
    function formatHora(ts){
      return new Date(ts).toLocaleTimeString([], {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
      });
    }

    function renderizarChamadas(chamadas){
      container.innerHTML = "";

      if(!chamadas.length){
        semChamadas.classList.remove("d-none");
        totalChamadas.textContent = "Sem chamadas";
        return;
      }

      semChamadas.classList.add("d-none");

      chamadas.forEach(c=>{
        const card = document.createElement("div");
        card.className = "mesa-card";

        if(c.__novaFlag){
          card.classList.add("pulse");
          setTimeout(()=> card.classList.remove("pulse"), 1100);
          delete c.__novaFlag;
        }

        const hora = formatHora(c.timestamp);

        card.innerHTML = `
          <div class="mesa-number">${String(c.mesa).padStart(2,'0')}</div>
          <div class="mesa-time"></div>
        `;

        container.appendChild(card);
      });

      totalChamadas.textContent = `${chamadas.length} chamada${chamadas.length>1?"s":""}`;
    }

    socket.on("todasChamadas", lista=>{
      calls = (lista||[]).slice().sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
      renderizarChamadas(calls);
    });

    socket.on("novaChamada", c=>{
      c.__novaFlag = true;
      calls.push(c);
      calls.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
      renderizarChamadas(calls);
    });

    socket.on("atualizarChamadas", lista=>{
      calls = (lista||[]).slice().sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
      renderizarChamadas(calls);
    });

    socket.emit("listarChamadas");
  </script>
</body>
</html>
