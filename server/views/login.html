<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <!-- note o / inicial para resolver da raiz -->
  <link href="/bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { height:100vh; display:flex; justify-content:center; align-items:center; background:#f7f7f7; }
    .login-card { width:100%; max-width:380px; }
  </style>
</head>
<body>

  <div class="card shadow p-4 login-card">
    <h3 class="text-center mb-4">Entrar</h3>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail" required>
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" required>
      </div>

      <button class="btn btn-primary w-100 mt-2" type="submit">Entrar</button>

      <div id="error" class="text-danger mt-3 text-center"></div>
    </form>
  </div>

  <!-- script também com / inicial -->
  <script src="/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      const resp = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha })
      });

      const data = await resp.json();

      if (!resp.ok) {
        error.textContent = data.erro || "Erro ao fazer login.";
        return;
      }

      // localStorage.setItem("token", data.token);
      window.location.href = "/";
    });
  </script>
</body>
</html>
